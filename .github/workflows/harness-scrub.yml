# Kit-managed (Harness Kit): installed and updated by .harness/tools/harness.mjs; never edit here.
# O09 enforced (K006): right after an issue, PR, comment or review is posted or edited, removes
# "Generated by Claude Code" lines, Claude co-author and session lines, and claude.ai links from its
# body (.harness/tools/scrub.mjs). Safe on pull_request_target: it checks out only the default
# branch's .harness/tools, never the PR's code, and treats the body as data. Its own edit is made
# with GITHUB_TOKEN, whose events start no workflow, so it cannot loop.
name: harness-scrub

on:
  issues:
    types: [opened, edited]
  issue_comment:
    types: [created, edited]
  pull_request_target:
    types: [opened, edited]
  pull_request_review:
    types: [submitted, edited]
  pull_request_review_comment:
    types: [created, edited]

permissions:
  contents: read

concurrency:
  group: harness-scrub-${{ github.event_name }}-${{ github.event.comment.id || github.event.review.id || github.event.issue.number || github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  scrub:
    if: github.actor != 'github-actions[bot]'
    runs-on: ${{ vars.RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 3
    permissions:
      contents: read
      issues: write
      pull-requests: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ github.event.repository.default_branch }}
          sparse-checkout: .harness/tools
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      - name: Remove Claude attribution from the body
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node .harness/tools/scrub.mjs
