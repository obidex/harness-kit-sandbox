# Kit-managed (Harness Kit): installed and updated by .harness/tools/harness.mjs; never edit here.
# Action group: auto (it checks, reports, alerts or wakes by itself; .harness/tools/actions.mjs)
# Inbox pickup (O14, K009, K018, K024): when an issue gets the `inbox` label (or is reopened), wake
# this project's coordinator, but only if that issue is a queued request not yet woken, so the AI
# runs only when there is work, and a request already picked up or done never wakes it twice. This
# job posts the wake comment on the wake-channel pull request the coordinator subscribes to: a
# session cannot, because a subscribed session never receives a comment its own account posted.
# A project without a channel may fire a routine instead (INBOX_ROUTINE_URL, INBOX_ROUTINE_TOKEN).
# A project whose coordinator runs are event-fired (harness-wake, K033) is woken by the `wake` label,
# which the control repository's hands-inbox job sets with the hands App; this job then stands aside,
# since a label set with its own GITHUB_TOKEN would start no workflow (K036).
# Cost (O13): one short job per labelled or reopened inbox issue, nothing otherwise.
name: harness-inbox

on:
  issues:
    types: [labeled, reopened]

permissions:
  contents: read

concurrency:
  group: harness-inbox-${{ github.event.issue.number }}
  cancel-in-progress: false

jobs:
  wake:
    if: (github.event.action == 'labeled' && github.event.label.name == 'inbox') || (github.event.action == 'reopened' && contains(github.event.issue.labels.*.name, 'inbox'))
    runs-on: ${{ vars.RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 3
    permissions:
      contents: read
      issues: write          # the "Woke" or "Not delivered" note on the request
      pull-requests: write   # the wake comment on the channel pull request (K018, K024)
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          sparse-checkout: .harness/tools
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          package-manager-cache: false
      - name: Wake the coordinator if this is a queued request
        env:
          GH_TOKEN: ${{ github.token }}
          INBOX_OWN_TOKEN: 'true'
          ISSUE: ${{ github.event.issue.number }}
          INBOX_ROUTINE_URL: ${{ secrets.INBOX_ROUTINE_URL }}
          INBOX_ROUTINE_TOKEN: ${{ secrets.INBOX_ROUTINE_TOKEN }}
        run: node .harness/tools/inbox.mjs wake --repo "$GITHUB_REPOSITORY" --issue "$ISSUE"
