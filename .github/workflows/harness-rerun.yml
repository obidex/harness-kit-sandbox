# Kit-managed (Harness Kit): installed and updated by .harness/tools/harness.mjs; never edit here.
# Action group: auto (it checks, reports, alerts or wakes by itself; .harness/tools/actions.mjs)
# Runs on the chore lane: CHORE_RUNNER when set, else RUNNER (K059, .harness/ci.md).
# One automatic re-run of a failed check that does not block the merge (K075; .harness/tools/rerun.mjs).
# When a pull-request workflow named below fails on its first attempt, none of its failed jobs is a
# required check, and no required check on the pull request's head has failed, its failed jobs run once
# more before anyone is told: a GitHub hiccup (one 502 on one read) clears by itself. A second failure
# stays red, as it should; a required check's failure is never re-run here.
# The pull request is data: this runs from the default branch (workflow_run), checks out only the default
# branch's .harness/tools, never the pull request, and its only write is GitHub's re-run of that run.
# A fork's run, a run that did not fail and a second attempt start no job.
# Cost (O13): nothing for a run that did not fail (no job starts); one short job per failed first
# attempt, on the self-hosted CHORE_RUNNER or RUNNER where one is set, else about one GitHub-hosted minute.
# A pull-request workflow with another name is not watched.
name: harness-rerun

on:
  workflow_run:
    workflows: [harness-guard, harness-audit, harness-scrub, ci, CI, check, checks, test, tests, build, hands-check]
    types: [completed]

permissions:
  contents: read

concurrency:
  group: harness-rerun-${{ github.event.workflow_run.id }}
  cancel-in-progress: false

jobs:
  rerun:
    name: harness-rerun
    if: >-
      github.event.workflow_run.conclusion == 'failure' &&
      github.event.workflow_run.run_attempt == 1 &&
      startsWith(github.event.workflow_run.event, 'pull_request') &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ${{ vars.CHORE_RUNNER || vars.RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 3
    permissions:
      actions: write     # reads the failed run's jobs and starts GitHub's re-run of them
      checks: read       # the required checks on the pull request's head
      statuses: read
      contents: read     # the default branch's tools and the base branch's rules
      pull-requests: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          sparse-checkout: .harness/tools
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          package-manager-cache: false
      - name: Run a failed check that does not block the merge once more
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node .harness/tools/rerun.mjs
